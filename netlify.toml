# Configuración de Netlify para la app de nómina (Next.js 15 + Prisma + Supabase)
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Las variables de entorno NO van aquí: se capturan en
# Netlify → Site configuration → Environment variables
# (DATABASE_URL, DIRECT_URL, ASISTENCIAS_DATABASE_URL,
#  NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY)
